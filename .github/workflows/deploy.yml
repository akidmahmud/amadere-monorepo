name: Deploy to VPS (manual fallback)

# Deploys no longer run from here. Hostinger's network-level abuse filtering
# blackholes inbound SSH from datacenter/cloud ASNs — which is what
# GitHub-hosted runners are. Port 22 went first, we moved to 2222, and on
# 2026-09-05 that was blackholed too ("dial tcp ***:2222: i/o timeout", a
# silent drop rather than a refusal — sshd was healthy and both ports were
# reachable from an ordinary connection throughout). A third port would only
# buy time until the next sweep.
#
# The VPS now PULLS instead: amadere-deploy.timer checks origin/master every
# minute and runs deploy/poll-deploy.sh when it moves. No inbound connection,
# so no port and no source-ASN filter can break it. See
# deploy/install-poll-deploy.sh.
#
#   watch a deploy : journalctl -u amadere-deploy -f
#   deploy now     : sudo systemctl start amadere-deploy
#
# This workflow is kept, but manual-only: on `push` it would fail on every
# single commit, and a permanently red master hides real failures. Run it by
# hand if the network path to 2222 ever comes back.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          # Port 22 times out from GitHub-hosted runners specifically — almost
          # certainly Hostinger's network-level abuse filtering blackholing
          # SSH from datacenter/cloud ASNs (which is what GH Actions runners
          # are). 2222 is a second sshd listener added for exactly this (see
          # /etc/systemd/system/ssh.socket.d/listen.conf on the VPS) — regular
          # SSH access on 22 is untouched, this only changes what CI uses.
          port: 2222
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/amadere-monorepo

            # Always mirror origin/master exactly — no local changes should
            # ever exist on the deploy target, so reset instead of pull.
            git fetch origin master
            git reset --hard origin/master

            pnpm install --frozen-lockfile

            # Apply any new DB migrations before rebuilding.
            pnpm --filter @amader/db exec prisma migrate deploy

            # turbo builds every app/package in the correct dependency order.
            #
            # IMPORTANT: never delete apps/*/.next before this build. The old
            # PM2 processes serve live traffic from that directory for the
            # entire time this build runs (often minutes) — deleting it first
            # made every deploy cause a window of real 404s / missing JS
            # chunks (e.g. the admin sidebar) until `pm2 restart` below
            # finally ran. If a *previous* deploy got killed mid-build and
            # left a stale Next.js build lock, `pnpm build` will fail with
            # "Another next build process is already running" — only then do
            # we clear .next and retry, so the destructive cleanup only ever
            # happens in that rare failure case, not on every deploy.
            pnpm build || {
              echo "Build failed — clearing .next (possible stale build lock) and retrying once"
              rm -rf apps/admin/.next apps/web/.next
              pnpm build
            }

            pm2 restart backend admin web
