name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/amadere-monorepo

            # Always mirror origin/master exactly — no local changes should
            # ever exist on the deploy target, so reset instead of pull.
            git fetch origin master
            git reset --hard origin/master

            pnpm install --frozen-lockfile

            # Apply any new DB migrations before rebuilding.
            pnpm --filter @amader/db exec prisma migrate deploy

            # turbo builds every app/package in the correct dependency order.
            #
            # IMPORTANT: never delete apps/*/.next before this build. The old
            # PM2 processes serve live traffic from that directory for the
            # entire time this build runs (often minutes) — deleting it first
            # made every deploy cause a window of real 404s / missing JS
            # chunks (e.g. the admin sidebar) until `pm2 restart` below
            # finally ran. If a *previous* deploy got killed mid-build and
            # left a stale Next.js build lock, `pnpm build` will fail with
            # "Another next build process is already running" — only then do
            # we clear .next and retry, so the destructive cleanup only ever
            # happens in that rare failure case, not on every deploy.
            pnpm build || {
              echo "Build failed — clearing .next (possible stale build lock) and retrying once"
              rm -rf apps/admin/.next apps/web/.next
              pnpm build
            }

            pm2 restart backend admin web
